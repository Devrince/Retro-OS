<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Retro OS</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
      <!--Desktop-->  
      <main class="desktop">
        <div class="icon">
            <img src="assets/images/my-computer.png" alt="My Computer">
            <span>My Computer</span>
        </div>

        <div class="icon">
            <img src="assets/images/recycle-bin.png" alt="Recycle Bin">
            <span>Bin</span>
        </div>
      </main>

      <!--Taskbar-->
      <footer class="taskbar">
        <button class="start-button" aria-label="Start">
            <img src="assets/images/start-button.png" alt="Start">
        </button>

        <div class="tray">
            <img class="speaker" src="assets/images/speaker.png" alt="Volume">
            <span id="clock"00:00</span>
        </div>
      </footer>

      <script src="js/script.js"></script>
    </body>
</html>
